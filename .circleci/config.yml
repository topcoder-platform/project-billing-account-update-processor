version: 2.1

defaults: &defaults
  docker:
    - image: cimg/python:3.13.2-browsers

node_defaults: &node_defaults
  docker:
    - image: cimg/node:22.22.0

install_dependency: &install_dependency
  name: Install build and deployment dependencies
  command: |
    sudo apt update
    sudo apt install python3-pip
    sudo pip3 install awscli --upgrade

install_deploysuite: &install_deploysuite
  name: Install deployment suite
  command: |
    git clone --branch v1.4.17 https://github.com/topcoder-platform/tc-deploy-scripts ../buildscript
    cp ../buildscript/master_deploy.sh .
    cp ../buildscript/buildenv.sh .
    cp ../buildscript/awsconfiguration.sh .
    cp ../buildscript/psvar-processor.sh .

run_build: &run_build
  name: Build application image
  command: ./build.sh "$APPNAME"

builddeploy_steps: &builddeploy_steps
  - checkout
  - setup_remote_docker
  - run: *install_dependency
  - run: *install_deploysuite
  - run: *run_build
  - deploy:
      name: Deploy application
      command: |
        ./awsconfiguration.sh "$DEPLOY_ENV"
        source awsenvconf
        ./psvar-processor.sh -t appenv -p "/config/${APPNAME}/deployvar"
        source deployvar_env
        ./master_deploy.sh -d ECS -e "$DEPLOY_ENV" -t latest -j "/config/${APPNAME}/appvar,/config/common/global-appvar" -i "$APPNAME" -p FARGATE

jobs:
  quality:
    <<: *node_defaults
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ arch }}-{{ checksum "package-lock.json" }}
            - npm-v1-{{ arch }}-
      - run:
          name: Install locked dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Format, lint, and type-check
          command: |
            npm run format:check
            npm run lint
            npm run typecheck
      - run:
          name: Run tests
          command: npm test
      - run:
          name: Compile application
          command: npm run build

  build-dev:
    <<: *defaults
    environment:
      DEPLOY_ENV: DEV
      LOGICAL_ENV: dev
      APPNAME: project-billing-account-update-processor
    steps: *builddeploy_steps

  build-prod:
    <<: *defaults
    environment:
      DEPLOY_ENV: PROD
      LOGICAL_ENV: prod
      APPNAME: project-billing-account-update-processor
    steps: *builddeploy_steps

workflows:
  build:
    jobs:
      - quality
      - build-dev:
          context: org-global
          requires:
            - quality
          filters:
            branches:
              only: develop
      - build-prod:
          context: org-global
          requires:
            - quality
          filters:
            branches:
              only: master
